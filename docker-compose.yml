version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: insightiq-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightiq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - insightiq_pgdata:/var/lib/postgresql/data
      - ./database/schema/00_init_schemas_and_roles.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insightiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  insightiq_pgdata:
    name: insightiq_pgdata

